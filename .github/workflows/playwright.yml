name: Playwright Tests
 
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
 
permissions:
  contents: write
  pages: write
  id-token: write
 
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      INVALID_USERNAME: ${{ secrets.INVALID_USERNAME }}
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
      OBJECTS_API_URL: ${{ secrets.OBJECTS_API_URL }}
      POST_REQUEST_API_URL: ${{ secrets.POST_REQUEST_API_URL }}
      DELETE_REQUEST_API_URL: ${{ secrets.DELETE_REQUEST_API_URL }}
 
    steps:
    - uses: actions/checkout@v4
 
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
 
    - name: Install dependencies
      run: npm ci
 
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
 
    - name: Run Playwright tests
      run: npx playwright test
 
    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results
 
    - name: Generate Allure Report
      if: always()
      run: npm run allure:generate
 
    - name: Upload Allure Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report
 
  deploy:
    needs: test
    runs-on: ubuntu-latest
 
    steps:
    - name: Download Allure Report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report
 
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report